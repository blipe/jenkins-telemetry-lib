name: Materialize Jenkins telemetry source

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-jenkins-validation
          fetch-depth: 0

      - name: Stop when already materialized
        id: state
        shell: bash
        run: |
          if test -f bootstrap/source.tar.xz; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize complete source tree
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xJf bootstrap/source.tar.xz -C "$work"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work"/. .
          rm -rf bootstrap .github/workflows/bootstrap-source.yml

      - name: Verify dependency-free suite
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: ./scripts/verify-all.sh

      - name: Commit complete source tree
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Jenkins telemetry library"
          git push origin HEAD:agent/real-jenkins-validation
