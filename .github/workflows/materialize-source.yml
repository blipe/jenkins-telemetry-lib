name: Materialize Jenkins telemetry source

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  materialize-source:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'materialize-jenkins-telemetry-source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-jenkins-validation
          fetch-depth: 0

      - name: Materialize complete source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/source.tar.xz
          work="$(mktemp -d)"
          tar -xJf bootstrap/source.tar.xz -C "$work"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work"/. .
          rm -rf bootstrap .github/workflows/bootstrap-source.yml

      - name: Verify dependency-free suite
        shell: bash
        run: ./scripts/verify-all.sh

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Jenkins telemetry library"
          git push origin HEAD:agent/real-jenkins-validation

      - name: Close trigger issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
